<body>

 <div class="session-tools">
  <input id="sessionName" aria-label="Sohbet adı" placeholder="Sohbet adı yaz..." />
  <button onclick="newChatSession()">Yeni Sohbet</button>
  <button onclick="saveChatSession()">Sohbeti Kaydet</button>

  <button class="start" onclick="startListen()"> Başla</button>
  <button class="stop" onclick="stopListen()">■ Durdur</button>
  <button class="send" onclick="ask()">➤ Gönder</button>

  <button class="clear" onclick="clearBox()">× Temizle</button>
  <button class="read" onclick="downloadChat()">Geçmişi İndir</button>
  <button class="read" onclick="copyAllChat()">Tüm Sohbeti Kopyala</button>
  <button onclick="deleteSelectedSession()">Seçili Sohbeti Sil</button>
</div>

<div id="thinking">Düşünüyor<span class="dots"></span></div>

<script>
let lastAnswer = "";
let recognition = null;
let chatHistory = [];
let currentSessionName = "varsayilan";

const input = document.getElementById("input");
const output = document.getElementById("output");
const suggestions = document.getElementById("suggestions");
const thinking = document.getElementById("thinking");
const languageSelect = document.getElementById("languageSelect");
const chatBox = document.getElementById("chatBox");

function getAllSessions(){
  try { return JSON.parse(localStorage.getItem("zanistarast_sessions") || "{}"); }
  catch { return {}; }
}
function saveAllSessions(sessions){ localStorage.setItem("zanistarast_sessions", JSON.stringify(sessions)); }
function saveChat(){ localStorage.setItem("zanistarast_chat", JSON.stringify(chatHistory)); }

function renderChat(){
  chatBox.innerHTML = "";
  chatHistory.forEach(msg => addMessage(msg.type, msg.content, false));
}
function loadChat(){
  try { chatHistory = JSON.parse(localStorage.getItem("zanistarast_chat") || "[]"); }
  catch { chatHistory = []; }
  renderChat();
}

function addMessage(type, content, save = true){
  const div = document.createElement("div");
  div.className = type === "user" ? "message user-message" : "message ai-message";

  const contentEl = document.createElement("div");
  contentEl.className = "message-content";
  contentEl.textContent = String(content || "");

  const meta = document.createElement("div");
  meta.className = "message-meta";
  const time = document.createElement("span");
  time.textContent = new Date().toLocaleTimeString(languageSelect.value || "tr-TR", {hour:"2-digit", minute:"2-digit"});

  const copy = document.createElement("button");
  copy.type = "button";
  copy.textContent = "Kopyala";
  copy.addEventListener("click", () => copyMessage(copy));

  const del = document.createElement("button");
  del.type = "button";
  del.textContent = "Sil";
  del.addEventListener("click", () => deleteMessage(del));

  meta.append(time, copy, del);
  div.append(contentEl, meta);
  chatBox.appendChild(div);

  if(save){ chatHistory.push({type, content:String(content || "")}); saveChat(); }
  refreshMessageIndexes();
  div.scrollIntoView({behavior:"smooth", block:"end"});
}
function refreshMessageIndexes(){
  document.querySelectorAll(".message").forEach((msg,index)=>{ msg.dataset.index=index; });
}
async function copyMessage(btn){
  const message=btn.closest(".message").querySelector(".message-content").innerText;
  await navigator.clipboard.writeText(message);
  btn.innerText="Kopyalandı";
  setTimeout(()=>btn.innerText="Kopyala",1200);
}
function deleteMessage(btn){
  chatHistory.splice(Number(btn.closest(".message").dataset.index),1);
  saveChat(); renderChat();
}

function saveChatSession(){
  const name=document.getElementById("sessionName").value.trim() || currentSessionName || "varsayilan";
  const sessions=getAllSessions(); sessions[name]=chatHistory; saveAllSessions(sessions);
  currentSessionName=name; refreshSessionList(); alert("Sohbet kaydedildi: "+name);
}
function refreshSessionList(){
  const list=document.getElementById("sessionList"); list.innerHTML="";
  const first=document.createElement("option"); first.value=""; first.textContent="Kayıtlı sohbet seç"; list.appendChild(first);
  Object.keys(getAllSessions()).forEach(name=>{ const o=document.createElement("option"); o.value=name; o.textContent=name; list.appendChild(o); });
}
function loadSelectedSession(){
  const name=document.getElementById("sessionList").value; if(!name) return;
  chatHistory=getAllSessions()[name] || []; currentSessionName=name;
  document.getElementById("sessionName").value=name; renderChat(); saveChat();
}
function deleteSelectedSession(){
  const list=document.getElementById("sessionList"), name=list.value;
  if(!name){ alert("Silmek için önce kayıtlı bir sohbet seç."); return; }
  if(!confirm("Bu sohbet silinsin mi: "+name+"?")) return;
  const sessions=getAllSessions(); delete sessions[name]; saveAllSessions(sessions); refreshSessionList();
  if(currentSessionName===name) newChatSession();
}
function newChatSession(){
  chatHistory=[]; currentSessionName="sohbet-"+new Date().toLocaleString("tr-TR");
  chatBox.innerHTML=""; input.value=""; output.textContent=""; suggestions.innerHTML=""; lastAnswer="";
  document.getElementById("sessionName").value=currentSessionName; localStorage.removeItem("zanistarast_chat");
}
function plainHistory(){
  return chatHistory.map(msg=>(msg.type==="user"?"Kullanıcı":"Zanistarast AI")+": "+msg.content).join("\n\n");
}
function downloadChat(){
  if(!chatHistory.length){ alert("İndirilecek geçmiş yok."); return; }
  const url=URL.createObjectURL(new Blob([plainHistory()],{type:"text/plain;charset=utf-8"}));
  const a=document.createElement("a"); a.href=url; a.download="zanistarast-chat-gecmisi.txt"; a.click(); URL.revokeObjectURL(url);
}
async function copyAllChat(){
  if(!chatHistory.length){ alert("Kopyalanacak sohbet yok."); return; }
  await navigator.clipboard.writeText(plainHistory()); alert("Tüm sohbet kopyalandı.");
}

function getSuggestions(q){
  const text=String(q||"").trim();
  return text ? [
    "Bu cevabın kaynakları nelerdir?",
    "Epistemik statüsü nedir?",
    "Karşı kanıt veya belirsizlik var mı?"
  ] : [];
}
function renderSuggestions(q){
  suggestions.innerHTML="";
  const list=getSuggestions(q); if(!list.length) return;
  const title=document.createElement("h4"); title.textContent="Konuyla ilgili şunları da sorabilirsin:"; suggestions.appendChild(title);
  list.forEach(item=>{ const b=document.createElement("button"); b.type="button"; b.textContent=item; b.addEventListener("click",()=>askSuggestion(item)); suggestions.appendChild(b); });
}
function askSuggestion(text){ input.value=text; ask(); }

const mediaLabels={chart:"Grafik",table:"Tablo",diagram:"Bilimsel şema",timeline:"Zaman çizelgesi",map:"Harita",interactive:"İnteraktif model",animation:"Animasyon",observation:"Gözlem materyali",experiment:"Deney materyali",audio:"Ses",video:"Video"};
function formatMediaHints(meta){
  const hints=Array.isArray(meta?.media_hints) ? meta.media_hints : [];
  if(!hints.length) return "";
  return "\n\nBilimsel anlatım önerisi\n"+hints.map(h=>"- "+(mediaLabels[h.kind]||h.kind)+": "+String(h.reason||"")).join("\n");
}

function formatMiraResponse(data){
  const answer=String(data?.answer || "");
  const meta=data?.meta || {};
  const status=[
    meta.authority_status && `Kaynak otoritesi: ${meta.authority_status}`,
    meta.epistemic_status && `Epistemik statü: ${meta.epistemic_status}`,
    meta.rasterast_status && `Rasterast: ${meta.rasterast_status}`,
    meta.provenance_status && `Kaynak izi: ${meta.provenance_status}`
  ].filter(Boolean);
  const sources=Array.isArray(meta.sources) ? meta.sources : [];
  const sourceLines=sources.slice(0,8).map(source=>{
    const title=String(source.title || source.id || "Kaynak");
    const authority=String(source.authority_status || "UNVERIFIED");
    return `- ${title} [${authority}]`;
  });
  return [
    answer,
    status.length ? `\n\nDurum\n${status.join("\n")}` : "",
    sourceLines.length ? `\n\nKaynaklar\n${sourceLines.join("\n")}` : "",
    formatMediaHints(meta)
  ].join("");
}

async function sendMessage(question){
  const configuredApiBase = document.querySelector('meta[name="zanistarast-api-base"]')?.content?.trim();
  const apiBase = configuredApiBase || document.baseURI;
  const response=await fetch(new URL("api/ask", apiBase),{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({question, language:languageSelect.value})
  });
  let data={};
  try { data=await response.json(); } catch {}
  if(!response.ok) throw new Error(data.answer || data.error || "Mira API isteği başarısız.");
  return {
    answer:String(data.answer || ""),
    display:formatMiraResponse(data),
    meta:data.meta || {}
  };
}
async function ask(){
  const q=input.value.trim(); if(!q) return;
  addMessage("user",q); input.value=""; thinking.classList.add("show");
  try {
    const miraResponse=await sendMessage(q);
    lastAnswer=miraResponse.answer;
    addMessage("ai",miraResponse.display);
    renderSuggestions(q);
  } catch(error) {
    const offline = typeof navigator !== "undefined" && navigator.onLine === false;
    const message = offline
      ? "Mira çevrimdışı kullanılamaz. İnternet bağlantısı yeniden kurulduğunda tekrar deneyin."
      : "Mira bağlantısı kurulamadı. Lütfen kısa süre sonra tekrar deneyin.";
    output.textContent=message; addMessage("ai",message);
  } finally { thinking.classList.remove("show"); }
}

function readAnswer(){
  if(!lastAnswer || !("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(lastAnswer); u.lang=languageSelect.value;
  if(!speechSynthesis.getVoices().some(v=>v.lang===u.lang)) u.lang="en-US";
  speechSynthesis.speak(u);
}
function clearBox(){
  input.value=""; output.textContent=""; suggestions.innerHTML=""; chatBox.innerHTML="";
  lastAnswer=""; chatHistory=[]; localStorage.removeItem("zanistarast_chat"); thinking.classList.remove("show");
}
function startListen(){
  const SR=window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ output.textContent="Bu tarayıcı konuşma algılamayı desteklemiyor."; return; }
  recognition=new SR(); recognition.lang=languageSelect.value; recognition.interimResults=true;
  recognition.onresult=e=>{ let text=""; for(let i=0;i<e.results.length;i++) text+=e.results[i][0].transcript; input.value=text; };
  recognition.onerror=()=>{ output.textContent="Konuşma algılama kullanılamadı. Metin yazarak devam edebilirsiniz."; };
  recognition.start();
}
function stopListen(){ if(recognition) recognition.stop(); }

let currentSpeech=null;
function startReading(){
  if(!("speechSynthesis" in window)) return;
  const text=document.querySelector("main")?.innerText || document.querySelector(".panel")?.innerText || document.body.innerText;
  speechSynthesis.cancel(); currentSpeech=new SpeechSynthesisUtterance(text); currentSpeech.lang=languageSelect.value; speechSynthesis.speak(currentSpeech);
}
function pauseReading(){ if("speechSynthesis" in window) speechSynthesis.pause(); }
function resumeReading(){ if("speechSynthesis" in window) speechSynthesis.resume(); }
function stopReading(){ if("speechSynthesis" in window) speechSynthesis.cancel(); }

window.addEventListener("load",()=>{ loadChat(); refreshSessionList(); });
</script>

<!-- Legacy browser reasoning modules are intentionally not loaded on the live Mira
     answer surface. They remain in the repository for historical/experimental
     compatibility; live answers use /api/ask with status-aware RAG. -->
