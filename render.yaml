services:
  - type: web
    name: zanistarast-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGINS
        value: https://zanistarast.org,https://veysieken000-ctrl.github.io
      - key: OPENAI_API_KEY
        sync: false
      - key: INTERNAL_API_TOKEN
        sync: false
