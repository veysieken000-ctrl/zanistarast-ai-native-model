<text x="859" y="695" font-size="13" font-weight="normal" text-anchor="start">İradî ahlak</text>
<rect x="545" y="752" width="513" height="73" rx="12" fill="#e4eef4" stroke="#c2d5df"/>
<text x="559" y="775" font-size="13" font-weight="normal" text-anchor="start">D6 Tümdengelim</text>
<text x="559" y="794" font-size="13" font-weight="normal" text-anchor="start">hükmü</text>
<text x="673" y="775" font-size="13" font-weight="normal" text-anchor="start">Yargılama / Haşir</text>
<text x="673" y="794" font-size="13" font-weight="normal" text-anchor="start">meydanı</text>
<text x="859" y="775" font-size="13" font-weight="normal" text-anchor="start">Hükme bağlama / Cennet</text>
<text x="859" y="794" font-size="13" font-weight="normal" text-anchor="start">veya Cehennem&#x27;de ebedî</text>
<text x="859" y="813" font-size="13" font-weight="normal" text-anchor="start">hayat</text>
<text x="545" y="857" font-size="13" font-weight="normal" text-anchor="start">Kara delikler: birinci evrede kurucu araştırma iddiası.</text>
<text x="545" y="884" font-size="13" font-weight="normal" text-anchor="start">Evre sırası, evrensel bir zaman veya büyüklük sırası değildir.</text>
<rect x="42" y="931" width="1016" height="117" rx="12" fill="#d9eee9" stroke="#c2d5df"/>
<text x="62" y="963" font-size="16" font-weight="bold" text-anchor="start">İnsan katmanları H1-H6; araştırma katmanları L1-L6 ayrı sayımlardır.</text>
<text x="62" y="994" font-size="15" font-weight="normal" text-anchor="start">Varlıksı: kendi ölçeğinde merkez-katman bütünlüğü oluşmamış parça.</text>
<text x="62" y="1024" font-size="15" font-weight="normal" text-anchor="start">Zanabûn: aynı sonuç ve bağlam için iki ayrı bilenin onayı.</text>
<text x="42" y="1080" font-size="14" font-weight="normal" text-anchor="start">Daireler simgeseldir; uzaklık veya dalga boyu ölçeği değildir.</text>
<text x="42" y="1113" font-size="14" font-weight="normal" text-anchor="start">Veysi yê MALA SAF - 22 Kasım 2026 - v04</text>
</g></svg>
