name: zanistarast-com-smoke

on:
  push:
    branches:
      - feat/zanistarast-com
    paths:
      - "zanistarast-com/**"
      - "zanistarast-com-api/**"
      - "render.yaml"
      - ".github/workflows/zanistarast-com-smoke.yml"
  pull_request:
    paths:
      - "zanistarast-com/**"
      - "zanistarast-com-api/**"
      - "render.yaml"
      - ".github/workflows/zanistarast-com-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run com smoke
        run: node zanistarast-com/test.mjs
      - name: Run com API smoke
        run: node zanistarast-com-api/test.cjs
      - name: Verify static production boundary
        shell: bash
        run: |
          set -euo pipefail
          for f in index.html styles.css app.js data.js domain.js contracts.js content-adapter.js media.js user-state.js discovery.js runtime-config.js production-readiness.js manifest.webmanifest sw.js readiness-state.json; do
            test -s "zanistarast-com/$f"
          done
          test ! -e zanistarast-com/CNAME
          node -e 'const s=require("./zanistarast-com/readiness-state.json"); if(s.productionReady||s.domainActivationAllowed||s.liveClaimAllowed) process.exit(1)'
      - name: Repository secret pattern guard
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const root = "zanistarast-com";
          const skip = new Set(["test.mjs"]);
          const patterns = [
            /BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY/i,
            /postgres(?:ql)?:\/\/[^\s]+:[^\s]+@/i,
            /api[_-]?key\s*[:=]\s*["'][^"']+/i,
            /secret\s*[:=]\s*["'][^"']+/i
          ];
          let bad = false;
          function walk(dir) {
            for (const ent of fs.readdirSync(dir, {withFileTypes:true})) {
              if (ent.name === ".git") continue;
              const p = path.join(dir, ent.name);
              if (ent.isDirectory()) walk(p);
              else if (!skip.has(ent.name)) {
                const text = fs.readFileSync(p, "utf8");
                if (patterns.some(re => re.test(text))) {
                  console.error("Potential secret material detected in " + p);
                  bad = true;
                }
              }
            }
          }
          walk(root);
          if (bad) process.exit(1);
          NODE
