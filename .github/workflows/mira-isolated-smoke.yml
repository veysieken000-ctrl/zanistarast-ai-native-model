name: Mira isolated smoke checks
on:
  push:
    branches:
      - fix/mira-runtime-audit-2026-10-11
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check server and RAG syntax
        run: |
          node --check backend/server.js
          node --check backend/rag_search.js
      - name: Core HTML search tests
        run: node --test backend/tests/mira_rag_smoke.test.js
