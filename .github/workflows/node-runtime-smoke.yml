name: Node Runtime Smoke

on:
  push:
    branches:
      - repair/runtime-boundary
  pull_request:
  workflow_dispatch:

jobs:
  backend-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout formal foundations
        uses: actions/checkout@v4
        with:
          repository: veysieken000-ctrl/zanistarast-formal-foundations
          path: zanistarast-formal-foundations

      - name: Place formal foundations at runtime path
        run: mv zanistarast-formal-foundations ../zanistarast-formal-foundations
        working-directory: .

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install backend dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Start backend and check health
        shell: bash
        run: |
          set -euo pipefail
          node server.js > /tmp/zanistarast-backend.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT

          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:3000/api/runtime/health > /tmp/health.json; then
              cat /tmp/health.json
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              cat /tmp/zanistarast-backend.log
              exit 1
            fi
            sleep 1
          done

          if ! curl --fail --silent http://127.0.0.1:3000/api/runtime/health > /dev/null; then
            cat /tmp/zanistarast-backend.log
            exit 1
          fi

          status=$(curl --silent --output /tmp/ask-empty.json --write-out "%{http_code}" \
            -H "Content-Type: application/json" \
            -d '{"question":""}' \
            http://127.0.0.1:3000/api/ask)
          test "$status" = "400"
          grep -q '"answer"' /tmp/ask-empty.json

          status=$(curl --silent --output /tmp/ask-no-provider.json --write-out "%{http_code}" \
            -H "Content-Type: application/json" \
            -d '{"question":"Zanistarast"}' \
            http://127.0.0.1:3000/api/ask)
          test "$status" = "500"
          grep -q 'OPENAI_API_KEY is missing' /tmp/ask-no-provider.json
