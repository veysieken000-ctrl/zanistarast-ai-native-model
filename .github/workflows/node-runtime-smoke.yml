name: Node Runtime Smoke

on:
  push:
    branches:
      - repair/runtime-boundary
  pull_request:
  workflow_dispatch:

jobs:
  backend-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout formal foundations
        uses: actions/checkout@v4
        with:
          repository: veysieken000-ctrl/zanistarast-formal-foundations
          path: zanistarast-formal-foundations

      - name: Place formal foundations at runtime path
        run: mv zanistarast-formal-foundations ../zanistarast-formal-foundations
        working-directory: .

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install backend dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Check RAG epistemic boundary
        run: node tests/rag_epistemic_boundary.mjs

      - name: Check embedding retrieval boundary
        run: node tests/embedding_boundary.mjs

      - name: Check embedding build stage
        run: node tests/embedding_build_stage.mjs

      - name: Check hybrid RAG fallback
        run: node tests/hybrid_rag_fallback.mjs

      - name: Check hybrid RAG chunk merge
        run: node tests/hybrid_rag_chunk_merge.mjs





      - name: Check processed RAG pipeline
        run: |
          python3 scripts/01_build_chunks.py
          python3 scripts/02_export_jsonl.py
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/processed_knowledge.jsonl")
          assert path.exists(), "processed_knowledge.jsonl was not created"

          rows = [json.loads(line) for line in path.read_text(encoding="utf-8").splitlines() if line.strip()]
          assert rows, "processed knowledge export is empty"

          for row in rows:
              assert row["source_type"] == "RepositoryKnowledge"
              assert row["authority_status"] == "UNVERIFIED"
              assert row["epistemic_status"] == "UNVERIFIED"
              assert row["rasterast_status"] == "NOT_REVIEWED"
              assert row["provenance_status"] == "PARTIAL"
              assert str(row.get("repository_path") or "").startswith("backend/knowledge/")

          print(f"Processed RAG pipeline: OK ({len(rows)} chunks)")
          PY


      - name: Start backend and check health
        shell: bash
        run: |
          set -euo pipefail
          node server.js > /tmp/zanistarast-backend.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT

          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:3000/api/runtime/health > /tmp/health.json; then
              cat /tmp/health.json
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              cat /tmp/zanistarast-backend.log
              exit 1
            fi
            sleep 1
          done

          if ! curl --fail --silent http://127.0.0.1:3000/api/runtime/health > /dev/null; then
            cat /tmp/zanistarast-backend.log
            exit 1
          fi

          status=$(curl --silent --output /tmp/ask-empty.json --write-out "%{http_code}" \
            -H "Content-Type: application/json" \
            -d '{"question":""}' \
            http://127.0.0.1:3000/api/ask)
          echo "ask-empty status=$status"
          cat /tmp/ask-empty.json
          test "$status" = "400"
          grep -q '"answer"' /tmp/ask-empty.json

          status=$(curl --silent --output /tmp/ask-no-provider.json --write-out "%{http_code}" \
            -H "Content-Type: application/json" \
            -d '{"question":"Zanistarast"}' \
            http://127.0.0.1:3000/api/ask)
          echo "ask-no-provider status=$status"
          cat /tmp/ask-no-provider.json
          test "$status" = "500"
          grep -q 'OPENAI_API_KEY is missing' /tmp/ask-no-provider.json

          for route in query interpret evaluate; do
            status=$(curl --silent --output "/tmp/$route.json" --write-out "%{http_code}" \
              -H "Content-Type: application/json" \
              -d '{"question":"Zanistarast"}' \
              "http://127.0.0.1:3000/api/$route")
            echo "$route status=$status"
            cat "/tmp/$route.json"

            if [ "$route" = "query" ]; then
              test "$status" = "200"
              grep -q '"authority_status":"UNVERIFIED"' "/tmp/$route.json"
              grep -q '"epistemic_status":"UNVERIFIED"' "/tmp/$route.json"
              grep -q '"rasterast_status":"NOT_REVIEWED"' "/tmp/$route.json"
              grep -q '"provenance_status":"PARTIAL"' "/tmp/$route.json"
            else
              test "$status" = "500"
              grep -q 'no live API key is configured' "/tmp/$route.json"
            fi
          done
