name: Node Runtime Smoke

on:
  push:
    branches:
      - repair/runtime-boundary
  pull_request:
  workflow_dispatch:

jobs:
  backend-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout formal foundations
        uses: actions/checkout@v4
        with:
          repository: veysieken000-ctrl/zanistarast-formal-foundations
          path: zanistarast-formal-foundations

      - name: Place formal foundations at runtime path
        run: mv zanistarast-formal-foundations ../zanistarast-formal-foundations
        working-directory: .

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install backend dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Check RAG epistemic boundary
        run: node tests/rag_epistemic_boundary.mjs

      - name: Check verifier epistemic boundary
        run: node tests/verifier_epistemic_boundary.mjs

      - name: Check Shared Mira Core contract
        run: node tests/shared_mira_core.mjs

      - name: Check formal epistemic boundary
        run: node tests/formal_epistemic_boundary.mjs

      - name: Check operational confidence boundary
        run: node tests/operational_confidence_boundary.mjs

      - name: Check runtime status vocabulary
        run: node tests/runtime_status_vocabulary.mjs

      - name: Check formal API review boundary
        run: node tests/formal_api_review_boundary.mjs

      - name: Check core review output boundary
        run: node tests/core_review_output_boundary.mjs

      - name: Check API aggregate authority boundary
        run: node tests/api_aggregate_authority_boundary.mjs

      - name: Check AI route aggregate status
        run: node tests/ai_route_aggregate_status.mjs

      - name: Check RAG ingestion status boundary
        run: node tests/rag_ingestion_status_boundary.mjs

      - name: Check mobile UI quality boundary
        run: node tests/mobile_ui_quality_boundary.mjs

      - name: Check speech Mira boundary
        run: node tests/speech_mira_boundary.mjs

      - name: Check manifest Mira terminology boundary
        run: node tests/manifest_mira_terminology_boundary.mjs

      - name: Check manifest authority boundary
        run: node tests/manifest_authority_boundary.mjs

      - name: Check embedding retrieval boundary
        run: node tests/embedding_boundary.mjs

      - name: Check embedding build stage
        run: node tests/embedding_build_stage.mjs

      - name: Check hybrid RAG fallback
        run: node tests/hybrid_rag_fallback.mjs

      - name: Check hybrid RAG chunk merge
        run: node tests/hybrid_rag_chunk_merge.mjs





      - name: Check processed RAG pipeline
        run: |
          python3 scripts/01_build_chunks.py
          python3 scripts/02_export_jsonl.py
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/processed_knowledge.jsonl")
          assert path.exists(), "processed_knowledge.jsonl was not created"

          rows = [json.loads(line) for line in path.read_text(encoding="utf-8").splitlines() if line.strip()]
          assert rows, "processed knowledge export is empty"

          for row in rows:
              assert row["source_type"] in {"RepositoryKnowledge", "RepositoryHTML"}
              assert row["authority_status"] == "UNVERIFIED"
              assert row["epistemic_status"] == "UNVERIFIED"
              assert row["rasterast_status"] == "NOT_REVIEWED"
              assert row["provenance_status"] == "PARTIAL"
              repository_path = str(row.get("repository_path") or "")
              assert repository_path
              if row["source_type"] == "RepositoryKnowledge":
                  assert repository_path.startswith("backend/knowledge/")
              else:
                  assert repository_path.endswith(".html")

          print(f"Processed RAG pipeline: OK ({len(rows)} chunks)")
          PY


      - name: Check zanistarast.org production shell
        working-directory: .
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import re
          import xml.etree.ElementTree as ET

          root = pathlib.Path(".")
          index = (root / "index.html").read_text(encoding="utf-8")
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          robots = (root / "robots.txt").read_text(encoding="utf-8")
          sitemap = (root / "sitemap.xml").read_text(encoding="utf-8")

          assert 'rel="canonical" href="https://zanistarast.org/"' in index
          assert 'property="og:url" content="https://zanistarast.org/"' in index
          assert 'application/ld+json' in index
          assert manifest["icons"], "PWA icon metadata is missing"
          for icon in manifest["icons"]:
              assert (root / icon["src"].removeprefix("./")).exists()
          assert (root / "404.html").exists()
          assert "Sitemap: https://zanistarast.org/sitemap.xml" in robots
          ET.fromstring(sitemap)

          missing = []
          html_files = list(root.glob("*.html")) + list((root / "articles").glob("*.html"))
          for page in html_files:
              text = page.read_text(encoding="utf-8", errors="ignore")
              for href in re.findall(r'href=["\']([^"\']+)["\']', text, flags=re.I):
                  if href.startswith(("http://", "https://", "#", "mailto:", "tel:", "javascript:")) or "${" in href:
                      continue
                  target = href.split("#", 1)[0].split("?", 1)[0]
                  if not target:
                      continue
                  resolved = (page.parent / target).resolve()
                  try:
                      resolved.relative_to(root.resolve())
                  except ValueError:
                      continue
                  if not resolved.exists():
                      missing.append(f"{page}: {href}")
          assert not missing, "Broken local links:\n" + "\n".join(missing[:50])
          print(f"zanistarast.org production shell: OK ({len(html_files)} HTML pages checked)")
          PY

      - name: Start backend and check health
        shell: bash
        run: |
          set -euo pipefail
          node server.js > /tmp/zanistarast-backend.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT

          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:3000/api/runtime/health > /tmp/health.json; then
              cat /tmp/health.json
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              cat /tmp/zanistarast-backend.log
              exit 1
            fi
            sleep 1
          done

          if ! curl --fail --silent http://127.0.0.1:3000/api/runtime/health > /dev/null; then
            cat /tmp/zanistarast-backend.log
            exit 1
          fi

          status=$(curl --silent --output /tmp/ask-empty.json --write-out "%{http_code}" \
            -H "Content-Type: application/json" \
            -d '{"question":""}' \
            http://127.0.0.1:3000/api/ask)
          echo "ask-empty status=$status"
          cat /tmp/ask-empty.json
          test "$status" = "400"
          grep -q '"answer"' /tmp/ask-empty.json

          status=$(curl --silent --output /tmp/ask-no-provider.json --write-out "%{http_code}" \
            -H "Content-Type: application/json" \
            -d '{"question":"Zanistarast"}' \
            http://127.0.0.1:3000/api/ask)
          echo "ask-no-provider status=$status"
          cat /tmp/ask-no-provider.json
          test "$status" = "500"
          grep -q 'OPENAI_API_KEY is missing' /tmp/ask-no-provider.json

          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true

          NODE_ENV=production INTERNAL_API_TOKEN=test-internal-token node server.js > /tmp/zanistarast-production.log 2>&1 &
          prod_pid=$!

          for attempt in {1..20}; do
            if curl --silent http://127.0.0.1:3000/api/runtime/health > /dev/null; then
              break
            fi
            if ! kill -0 "$prod_pid" 2>/dev/null; then
              cat /tmp/zanistarast-production.log
              exit 1
            fi
            sleep 1
          done

          grep -q 'ZANISTARAST' ../index.html
          grep -q 'Zanistarast Mira & Speech' ../speech.html
          grep -q '/api/ask' ../speech.html

          ask_status=$(curl --silent --output /tmp/prod-ask-empty.json --write-out "%{http_code}" \
            -H "Origin: https://zanistarast.org" \
            -H "Content-Type: application/json" \
            -d '{"question":""}' \
            http://127.0.0.1:3000/api/ask)
          test "$ask_status" = "400"
          grep -q '"answer"' /tmp/prod-ask-empty.json

          for route in runtime/health formal/review query interpret evaluate; do
            method_args=()
            if [ "$route" != "runtime/health" ]; then
              method_args=(-H "Content-Type: application/json" -d '{"question":"Zanistarast"}')
            fi
            status=$(curl --silent --output /tmp/internal-denied.json --write-out "%{http_code}" "${method_args[@]}" "http://127.0.0.1:3000/api/$route")
            test "$status" = "404"
          done
          kill "$prod_pid" 2>/dev/null || true

          wait "$prod_pid" 2>/dev/null || true
