name: Node Runtime Smoke

on:
  push:
    branches:
      - repair/runtime-boundary
  pull_request:
  workflow_dispatch:

jobs:
  backend-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install backend dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Start backend and check health
        shell: bash
        run: |
          set -euo pipefail
          node server.js > /tmp/zanistarast-backend.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT

          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:3000/api/runtime/health > /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              cat /tmp/zanistarast-backend.log
              exit 1
            fi
            sleep 1
          done

          cat /tmp/zanistarast-backend.log
          exit 1
